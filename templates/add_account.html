<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>添加账号</title><style>body{background:#0b1220;color:white;font:16px Arial}.box{max-width:650px;margin:30px auto;padding:20px;background:#121c2b;border-radius:12px}label{display:grid;gap:6px;margin:12px 0}input,select{padding:11px;background:#0b1220;color:white;border:1px solid #33445d;border-radius:7px}button,a{padding:11px 15px;background:#2878f0;color:white;border:0;border-radius:7px;text-decoration:none}</style><div class='box'><h1>添加账号</h1><form method='post'>{% csrf_token %}<label>显示名称<input name='name' required></label><label>账号<input name='account_name'></label><label>登录方式<select name='login_mode'><option value='password'>账号密码</option><option value='qr'>扫码</option></select></label><label>密码<input name='password' type='password'></label><label>游戏客户端 EXE<input name='game_exe' placeholder='D:\Games\game.exe'></label><label>窗口标题<input name='window_title' value='梦幻西游'></label><button>保存</button> <a href='/'>返回</a></form><p>扫码登录的真实二维码应由客户端/官方登录流程提供，本项目不会伪造登录协议。</p></div></html>
