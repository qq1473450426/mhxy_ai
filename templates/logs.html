<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>日志</title><style>body{background:#0b1220;color:#e8eef8;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.log{padding:9px;border-bottom:1px solid #26364d;font-family:Consolas}</style><div class='wrap'><h1>{{account.name}} 日志</h1><a href='/'>返回</a>{% for l in logs %}<div class='log'><b>{{l.level}}</b> {{l.created}} · {{l.event}} · {{l.message}}</div>{% empty %}<p>暂无日志</p>{% endfor %}</div></html>
