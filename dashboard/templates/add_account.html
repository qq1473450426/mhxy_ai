<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加账号</title><link rel="stylesheet" href="/static/dashboard.css"></head><body><main class="form"><h1>添加账号</h1><form method="post">{%csrf_token%}<label>显示名称<input name="name" required></label><label>账号<input name="account_name"></label><label>登录方式<select name="login_mode"><option value="password">账号密码</option><option value="qr">扫码</option></select></label><label>密码<input name="password" type="password"></label><label>客户端 EXE<input name="game_exe" placeholder="D:\Games\game.exe"></label><label>启动参数<input name="launch_args"></label><label>窗口标题<input name="window_title" value="梦幻西游"></label><label><input type="checkbox" name="auto_login" checked> 自动登录</label><label><input type="checkbox" name="auto_reconnect" checked> 自动重连</label><label><input type="checkbox" name="auto_daily"> 自动日常</label><button class="btn">保存</button><a href="/">返回</a></form><p>扫码模式仅保存登录模式配置；真实客户端二维码应来自实际客户端登录流程，不伪造登录协议。</p></main></body></html>
